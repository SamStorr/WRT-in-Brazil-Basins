<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brazil River Basins</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<style>
  html, body { height:100%; margin:0; font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; }
  #map { position:absolute; top:0; bottom:0; left:0; right:0; }

  .panel {
    background: rgba(255,255,255,0.94);
    border-radius: 6px;
    box-shadow: 0 1px 6px rgba(0,0,0,0.25);
    padding: 10px 12px;
  }

  .info-panel {
    position:absolute; top:12px; right:12px; z-index:1000;
    width: 260px;
    max-width: calc(100vw - 24px);
    max-height: calc(100vh - 24px);
    overflow-y: auto;
  }
  .info-panel h1 {
    font-size: 15px;
    margin: 0 0 4px;
    color: #1b263b;
  }
  .info-panel .info-intro {
    font-size: 11.5px;
    margin: 0;
    color: #555;
    line-height: 1.35;
  }
  .info-panel .info-title {
    font-size: 15px;
    font-weight: 700;
    color: #1b263b;
    margin: 0 0 5px;
  }
  .info-panel .info-desc {
    font-size: 12px;
    line-height: 1.4;
    color: #333;
    margin: 0 0 10px;
  }
  .score-row { margin-top: 8px; }
  .score-row:first-of-type { margin-top: 0; }
  .score-label {
    font-size: 10.5px;
    font-weight: 600;
    line-height: 1.25;
    color: #555;
    margin-bottom: 3px;
  }
  .score-bar {
    display: flex;
    height: 16px;
    border-radius: 4px;
    overflow: hidden;
    background: #eee;
  }
  .score-seg {
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .score-seg span {
    font-size: 9px;
    font-weight: 600;
    color: #fff;
    text-shadow: 0 1px 1px rgba(0,0,0,0.35);
    white-space: nowrap;
  }
  .score-seg.seg-a { background: #4caf50; }
  .score-seg.seg-b { background: #fbc02d; }
  .score-seg.seg-c { background: #e53935; }

  .score-legend {
    display: flex;
    flex-direction: column;
    gap: 4px;
    margin-top: 12px;
    padding-top: 10px;
    border-top: 1px solid #e3e3e3;
  }
  .score-legend-row {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 10.5px;
    color: #555;
  }
  .score-legend-swatch {
    width: 10px;
    height: 10px;
    border-radius: 2px;
    flex: 0 0 auto;
  }

  .basin-label {
    font-size: 11px;
    font-weight: 500;
    color: #1b263b;
    white-space: nowrap;
    text-shadow:
      -1px -1px 0 #fff, 1px -1px 0 #fff,
      -1px  1px 0 #fff, 1px  1px 0 #fff,
      0 0 3px #fff;
    transform: translate(-50%, -50%);
    pointer-events: none;
  }

  .leaflet-control-attribution { font-size: 10px; }
</style>
</head>
<body>

<div id="map"></div>

<div class="panel info-panel" id="info-panel">
  <div id="info-placeholder">
    <h1>Brazil River Basins</h1>
    <p class="info-intro">Hover (or tap) a shaded basin to see its details.</p>
  </div>
  <div id="info-content" style="display:none;">
    <h2 class="info-title" id="info-title"></h2>
    <p class="info-desc" id="info-desc"></p>
    <div id="info-scores"></div>
    <div class="score-legend">
      <div class="score-legend-row"><span class="score-legend-swatch" style="background:#4caf50;"></span>Strongly supported</div>
      <div class="score-legend-row"><span class="score-legend-swatch" style="background:#fbc02d;"></span>Partially supported</div>
      <div class="score-legend-row"><span class="score-legend-swatch" style="background:#e53935;"></span>Not included</div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@turf/turf@7/turf.min.js"></script>
<script>
(function () {
  "use strict";

  var SHAPES_URL = "basins_brazil.json";
  var INFO_URL = "basin-data.json";

  var COLORS = ["#2a6f97", "#1b998b", "#b5651d", "#6a4c93", "#c1121f", "#588157"];

  // The two data files spell some basin names with different dash characters
  // (non-breaking hyphen vs. en dash) — normalize before matching on name.
  function normalizeName(s) {
    return (s || "").replace(/[\u2010-\u2015]/g, "-").trim();
  }

  var CATEGORY_LABELS = {
    BP: "Water in the basin plans",
    DP: "Water in sub-national development planning and governance",
    CC: "Water and climate connections in specific sectors",
    CF: "Links to climate financing and project implementation"
  };

  function seg(cls, value) {
    return '<div class="score-seg ' + cls + '" style="flex:' + value + ' ' + value + ' 0">' +
             '<span>' + value + '%</span>' +
           '</div>';
  }

  function buildScoreBars(scores) {
    var html = "";
    Object.keys(scores).forEach(function (cat) {
      var vals = scores[cat];
      var label = CATEGORY_LABELS[cat] || cat;
      html +=
        '<div class="score-row">' +
          '<div class="score-label">' + label + '</div>' +
          '<div class="score-bar">' +
            seg("seg-a", vals[0]) + seg("seg-b", vals[1]) + seg("seg-c", vals[2]) +
          '</div>' +
        '</div>';
    });
    return html;
  }

  function defaultStyle(color) {
    return { color: color, weight: 2, fillColor: color, fillOpacity: 0.35, opacity: 0.9 };
  }
  function hoverStyle(color) {
    return { color: color, weight: 3, fillColor: color, fillOpacity: 0.6, opacity: 1 };
  }

  var map = L.map("map", { zoomControl: true }).setView([-14, -50], 4);

  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 18,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
  }).addTo(map);

  var basinLayerGroup = L.featureGroup().addTo(map);
  var labelLayerGroup = L.layerGroup().addTo(map);
  var basinLayers = [];

  function updateInfoPanel(name, info) {
    var placeholder = document.getElementById("info-placeholder");
    var content = document.getElementById("info-content");
    if (name) {
      document.getElementById("info-title").textContent = name;
      document.getElementById("info-desc").textContent = info ? (info.description || "") : "";
      document.getElementById("info-scores").innerHTML = info && info.scores ? buildScoreBars(info.scores) : "";
      content.style.display = "block";
      placeholder.style.display = "none";
    } else {
      content.style.display = "none";
      placeholder.style.display = "block";
    }
  }

  function resetBasins() {
    basinLayers.forEach(function (l) { l.setStyle(l._defaultStyle); });
    updateInfoPanel(null);
  }

  function wireBasinLayer(layer, name, color, info) {
    var def = defaultStyle(color);
    var hov = hoverStyle(color);
    layer._defaultStyle = def;
    layer.setStyle(def);

    layer.on("mouseover", function () { layer.setStyle(hov); updateInfoPanel(name, info); });
    layer.on("mouseout",  function () { layer.setStyle(def); updateInfoPanel(null); });
    layer.on("click", function (e) {
      L.DomEvent.stopPropagation(e);
      resetBasins();
      layer.setStyle(hov);
      updateInfoPanel(name, info);
    });
    basinLayers.push(layer);
  }

  map.on("click", resetBasins);

  function fetchJSON(url) {
    return fetch(url).then(function (r) {
      if (!r.ok) throw new Error("Could not load " + url + " (HTTP " + r.status + ")");
      return r.json();
    });
  }

  Promise.all([fetchJSON(SHAPES_URL), fetchJSON(INFO_URL)])
    .then(function (results) {
      var shapes = results[0];
      var infoByName = {};
      (results[1].basins || []).forEach(function (b) {
        infoByName[normalizeName(b.name)] = b;
      });

      shapes.features.forEach(function (f, i) {
        var name = f.properties.name;
        var color = COLORS[i % COLORS.length];
        var info = infoByName[normalizeName(name)];

        var layer = L.geoJSON(f);
        layer.eachLayer(function (l) { wireBasinLayer(l, name, color, info); });
        layer.addTo(basinLayerGroup);

        if (name) {
          var pt = turf.pointOnFeature(f);
          var lng = pt.geometry.coordinates[0], lat = pt.geometry.coordinates[1];
          var icon = L.divIcon({ className: "basin-label", html: name, iconSize: [0, 0] });
          L.marker([lat, lng], { icon: icon, interactive: false }).addTo(labelLayerGroup);
        }
      });

      map.fitBounds(basinLayerGroup.getBounds(), { padding: [20, 20] });
    })
    .catch(function (err) {
      console.error(err);
      document.getElementById("info-placeholder").innerHTML =
        '<p style="color:#a00;">Failed to load map data. Make sure basins_brazil.json and ' +
        INFO_URL + ' sit in the same folder as this HTML file.</p>';
    });
})();
</script>
</body>
</html>
